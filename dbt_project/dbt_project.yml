name: 'ecommerce_warehouse'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Date range for incremental processing
  start_date: '2023-01-01'
  end_date: '{{ run_started_at.strftime("%Y-%m-%d") }}'

models:
  ecommerce_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
    analytics:
      +materialized: table
      +schema: analytics

seeds:
  ecommerce_warehouse:
    +schema: seeds
