version: 2

models:
  - name: dim_customers
    description: Customer dimension with demographics, lifetime value, and status
    columns:
      - name: customer_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural key from source system
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - unique
      - name: customer_status
        tests:
          - accepted_values:
              values: ['Never Purchased', 'Active', 'At Risk', 'Lapsed', 'Churned']
      - name: value_tier
        tests:
          - accepted_values:
              values: ['Platinum', 'Gold', 'Silver', 'Bronze']

  - name: dim_products
    description: Product dimension with pricing, inventory, and performance metrics
    columns:
      - name: product_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: product_id
        description: Natural key from source system
        tests:
          - unique
          - not_null
      - name: sku
        tests:
          - unique
      - name: list_price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: stock_status
        tests:
          - accepted_values:
              values: ['In Stock', 'Low Stock', 'Out of Stock']

  - name: dim_date
    description: Date dimension for time-based analytics
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: calendar_date
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: Order fact table at line item grain
    columns:
      - name: order_line_key
        description: Surrogate key for order line
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: quantity
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
      - name: net_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: order_status
        tests:
          - accepted_values:
              values: ['PENDING', 'PROCESSING', 'COMPLETED', 'SHIPPED', 'DELIVERED', 'CANCELLED', 'RETURNED']
